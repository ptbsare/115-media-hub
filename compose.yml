services:
  # 这个服务名是历史命名（早期用于区分测试环境），不影响使用。
  # 所有本机相关的路径、端口都从同目录的 .env 读，模板见 .env.example：
  #   cp .env.example .env
  # 换机器或换磁盘时只改 .env，不用动这个文件。
  115-media-hub-test:

    build: .
    container_name: ${MH_CONTAINER_NAME:-115-media-hub}
    volumes:
      - ${MH_STRM_DIR:-./data/strm}:/app/strm
      - ${MH_LOGS_DIR:-./data/logs}:/app/logs
      - ${MH_CONFIG_DIR:-./data/config}:/app/config
      # 额外存储（跨盘复制暂存区用）。/app/storage 这个路径没有被其它功能占用，可以直接拿它当挂载点：
      #   1) 在 .env 里把 MH_STORAGE_DIR 换成你的大盘 / 机械硬盘 / NAS 路径
      #   2) 重建容器：docker compose up -d --force-recreate
      #   3) 设置页「参数配置 → 本地存储位置 → 更换目录」，列表里会自动出现它，点一下选中保存
      # macOS 用 /Volumes/media，Linux/NAS 用 /mnt/hdd 这类路径。不映射也能用：暂存默认落在 config 卷。
      - ${MH_STORAGE_DIR:-./data/storage}:/app/storage

    ports:
      - "${MH_PORT:-18080}:18080"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    restart: always
