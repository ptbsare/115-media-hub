name: CI

# 只在「可能产出镜像」的时刻跑，不在每次提交时跑：
#   push 且动了 version.json  → 发版路径：跑测试 → 绿了才构建推送镜像
#   workflow_dispatch         → 手动触发（默认可重建镜像，也可只跑测试）
#   pull_request              → 只跑测试，不构建
# 平时开发改代码不触发这里，本机 scripts/check.sh 仍然是开发期的主要验证手段。

on:
  push:
    branches: [main]
    paths:
      - version.json
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 构建并推送镜像（关掉就只跑测试；重建会覆盖同版本 tag）
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE_NAME: xianer235/115-media-hub

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.ref }}
      # 连续触发时只保留最新那次测试（省时间），但绝不影响正在跑的镜像构建
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --prefer-binary -r requirements.txt httpx

      - name: Compile Python
        run: python -m compileall -q app main.py

      - name: Check JS syntax
        run: |
          set -euo pipefail
          node --version
          fail=0
          while IFS= read -r js; do
            node --check "$js" || fail=1
          done < <(find static/js -name '*.js' -type f)
          exit "$fail"

      - name: Run unit tests
        # CI 机器上没有本机那条「禁止删除文件」的限制，所以直接跑全量，
        # 不需要 scripts/test_in_container.sh 那套容器绕行方案。
        run: python scripts/run_tests.py

  build-and-push:
    name: 构建并推送镜像
    needs: test
    # 走发版推送、或手动触发且勾了 publish 才出镜像；PR 永不构建
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref }}
      # 发版构建一旦开始就让它跑完：后面再触发一次，不该把正在推的 tag 掐掉
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(jq -r '.version // empty' version.json)"
          if [[ -z "$version" || "$version" == "dev" ]]; then
            echo "version.json must contain a release version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
